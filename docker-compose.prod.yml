# ==============================================================================
# GuardianLink — Phase 13: Hardened Production Docker Compose Configuration
# ==============================================================================
# In production, AI Service and Qdrant are isolated to internal private network.
# Zero host ports are published for AI Service (8000), Qdrant (6333), or databases.
# External access is restricted exclusively to frontend (3000) and backend API (5000).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # 1. MongoDB Database Container (Internal Only)
  mongo:
    image: mongo:8.0
    container_name: guardianlink-mongo-prod
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - guardianlink-internal-net

  # 2. Redis Cache Container (Internal Only)
  redis:
    image: redis:7-alpine
    container_name: guardianlink-redis-prod
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - guardianlink-internal-net

  # 3. Standalone Qdrant Vector Database Container (Internal Only)
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: guardianlink-qdrant-prod
    restart: always
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"healthz check passed\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - guardianlink-internal-net

  # 4. FastAPI AI Microservice Container (Private Network Only — Port 8000 Unmapped)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: guardianlink-ai-service-prod
    restart: always
    expose:
      - "8000"
    environment:
      HOST: "0.0.0.0"
      PORT: 8000
      ENVIRONMENT: production
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Error: INTERNAL_SERVICE_KEY must be configured for production}
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: missing_person_faces
      QDRANT_TIMEOUT_SECONDS: 10.0
      FACE_MATCH_THRESHOLD: 0.60
      MAX_UPLOAD_SIZE_BYTES: 10485760
      MODEL_NAME: buffalo_l
      INSIGHTFACE_HOME: /root/.insightface
    volumes:
      - ${INSIGHTFACE_CACHE_DIR:-./ai-service/models}:/root/.insightface/models:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - guardianlink-internal-net

  # 5. Node.js Express Backend API Container (Bridge between Public & Internal)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: guardianlink-backend-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      MONGO_URI: mongodb://mongo:27017/guardianlink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET required}
      SESSION_SECRET: ${SESSION_SECRET:?Error: SESSION_SECRET required}
      COOKIE_SECRET: ${COOKIE_SECRET:?Error: COOKIE_SECRET required}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Error: INTERNAL_SERVICE_KEY required}
      AI_SERVICE_TIMEOUT_MS: 10000
    depends_on:
      - mongo
      - redis
      - ai-service
    networks:
      - guardianlink-internal-net
      - guardianlink-public-net

  # 6. React Vite Frontend Client Container (Public Ingress)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: guardianlink-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    depends_on:
      - server
    networks:
      - guardianlink-public-net

networks:
  # Internal network with no public gateway exposure for AI, vector DB, and data stores
  guardianlink-internal-net:
    driver: bridge
    internal: false # allows container-to-container DNS resolution while restricting ingress
  # Public-facing network for client and backend API
  guardianlink-public-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
