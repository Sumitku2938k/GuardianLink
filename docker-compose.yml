services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:8.0
    container_name: guardianlink-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Redis In-Memory Cache Container
  redis:
    image: redis:7-alpine
    container_name: guardianlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Node.js Express Backend API Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: guardianlink-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/guardianlink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: guardianlink_super_secret_jwt_key_2026_safe_child_platform
      SESSION_SECRET: guardianlink_session_secret_key_889911
      COOKIE_SECRET: guardianlink_cookie_secret_key_774411
      ADMIN_NAME: GuardianLink Administrator
      ADMIN_EMAIL: admin@guardianlink.local
      ADMIN_PASSWORD: AdminDev@GuardianLink2026!
      ADMIN_PHONE: "9999900000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  # 4. React Vite Frontend Client Container
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: guardianlink-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  # 5. Mongo Express Web-based Database Browser GUI
  mongo-express:
    image: mongo-express:latest
    container_name: guardianlink-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  # 6. Standalone Qdrant Vector Database Container (Phase 6.4)
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: guardianlink-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"healthz check passed\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 7. FastAPI AI Microservice Container (Phase 6.5 / 6.6)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: guardianlink-ai-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: 8000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev_internal_secret_change_in_production}
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: missing_person_faces
      QDRANT_TIMEOUT_SECONDS: 10.0
      FACE_MATCH_THRESHOLD: 0.60
      MAX_UPLOAD_SIZE_BYTES: 10485760
      MODEL_NAME: buffalo_l
      INSIGHTFACE_HOME: /root/.insightface
    volumes:
      - ${INSIGHTFACE_CACHE_DIR:-./ai-service/models}:/root/.insightface/models:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
