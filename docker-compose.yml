services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:8.0
    container_name: guardianlink-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Redis In-Memory Cache Container
  redis:
    image: redis:7-alpine
    container_name: guardianlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Node.js Express Backend API Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: guardianlink-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
      MONGO_URI: mongodb://mongo:27017/guardianlink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: guardianlink_super_secret_jwt_key_2026_safe_child_platform
      SESSION_SECRET: guardianlink_session_secret_key_889911
      COOKIE_SECRET: guardianlink_cookie_secret_key_774411
      ADMIN_NAME: GuardianLink Administrator
      ADMIN_EMAIL: admin@guardianlink.local
      ADMIN_PASSWORD: AdminDev@GuardianLink2026!
      ADMIN_PHONE: "9999900000"
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_SECRET: guardianlink_ai_internal_secret_2026
      AI_MATCH_THRESHOLD: "0.55"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis
      - ai-service

  # 4. React Vite Frontend Client Container
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: guardianlink-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  # 5. Mongo Express Web-based Database Browser GUI
  mongo-express:
    image: mongo-express:latest
    container_name: guardianlink-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  # 6. Dedicated GuardianLink AI Integration Container
  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: guardianlink-ai-service
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      AI_SERVICE_SECRET: guardianlink_ai_internal_secret_2026
      GUARDIANLINK_QDRANT_PATH: /app/guardianlink_qdrant_data
      GUARDIANLINK_QDRANT_COLLECTION: guardianlink_children_faces
    volumes:
      - ./ai-services:/app
      - ai_qdrant_data:/app/guardianlink_qdrant_data

volumes:
  mongo_data:
  redis_data:
  ai_qdrant_data:

