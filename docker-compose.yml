name: guardianlinksem5og

services:
  # 1. MongoDB Database Container (Internal only, host port not exposed)
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis In-Memory Cache Container (Internal only, host port not exposed)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. Node.js Express Backend API Container (Literal application container: guardianlinksem5OG)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: guardianlinksem5OG
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/guardianlink}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-guardianlink_super_secret_jwt_key_2026_safe_child_platform}
      SESSION_SECRET: ${SESSION_SECRET:-guardianlink_session_secret_key_889911}
      COOKIE_SECRET: ${COOKIE_SECRET:-guardianlink_cookie_secret_key_774411}
      ADMIN_NAME: ${ADMIN_NAME:-GuardianLink Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@guardianlink.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminDev@GuardianLink2026!}
      ADMIN_PHONE: ${ADMIN_PHONE:-9999900000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-guardianlink_ai_internal_secret_2026}
      AI_MATCH_THRESHOLD: ${AI_MATCH_THRESHOLD:-0.55}
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. React Vite Frontend Client Container
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 5. Mongo Express Web-based Database Browser GUI
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

  # 6. Dedicated GuardianLink AI Integration Microservice (Internal only)
  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-guardianlink_ai_internal_secret_2026}
      GUARDIANLINK_QDRANT_PATH: /app/guardianlink_qdrant_data
      GUARDIANLINK_QDRANT_COLLECTION: ${GUARDIANLINK_QDRANT_COLLECTION:-guardianlink_children_faces}
    volumes:
      - ./ai-services:/app
      - ai_qdrant_data:/app/guardianlink_qdrant_data
      - insightface_models:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mongo_data:
  redis_data:
  ai_qdrant_data:
  insightface_models:

networks:
  default:
    name: guardianlinksem5og_network
